<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grouping Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .content {
            padding: 40px;
        }
        
        .upload-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px dashed #dee2e6;
            transition: all 0.3s;
        }
        
        .upload-section:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }
        
        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
        }
        
        .file-input-label:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .file-name {
            margin-top: 15px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            color: #2c3e50;
            font-weight: 500;
        }
        
        .settings-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .setting-group {
            margin-bottom: 25px;
        }
        
        .setting-group label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .setting-group input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .setting-group input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .radio-option {
            flex: 1;
            min-width: 200px;
        }
        
        .radio-option input[type="radio"] {
            display: none;
        }
        
        .radio-option label {
            display: block;
            padding: 15px 20px;
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-weight: 500;
        }
        
        .radio-option input[type="radio"]:checked + label {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .radio-option label:hover {
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            min-width: 150px;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(17, 153, 142, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ee0979 0%, #ff6a00 100%);
            color: white;
        }
        
        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(238, 9, 121, 0.4);
        }
        
        .results-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            display: none;
        }
        
        .results-section.show {
            display: block;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .stat-card .number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .stat-card .label {
            color: #6c757d;
            font-size: 0.9em;
        }
        
        .group-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .group-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }
        
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f8f9fa;
        }
        
        .group-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .group-stats {
            display: flex;
            gap: 20px;
        }
        
        .group-stat {
            text-align: center;
        }
        
        .group-stat .value {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }
        
        .group-stat .label {
            font-size: 0.85em;
            color: #6c757d;
        }
        
        .product-list {
            list-style: none;
        }
        
        .product-item {
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .product-name {
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .product-sales {
            color: #11998e;
            font-weight: 600;
            font-size: 0.95em;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .content {
                padding: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                min-width: 100%;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
            
            .group-header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Product Grouping Analysis</h1>
            <p>Analyze and group similar products based on descriptions</p>
        </div>
        
        <div class="content">
            <!-- Error Message -->
            <div id="errorMessage" class="error-message"></div>
            
            <!-- Upload Section -->
            <div class="upload-section">
                <h2 style="margin-bottom: 20px; color: #2c3e50;">📂 Upload Excel File</h2>
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" accept=".xlsx,.xls">
                    <label for="fileInput" class="file-input-label">
                        <span>📁 Click to select Excel file</span>
                    </label>
                </div>
                <div id="fileName" class="file-name" style="display: none;"></div>
            </div>
            
            <!-- Settings Section -->
            <div class="settings-section">
                <h2 style="margin-bottom: 25px; color: #2c3e50;">⚙️ Analysis Settings</h2>
                
                <div class="setting-group">
                    <label>Similarity Threshold (0.0 - 1.0)</label>
                    <input type="number" id="threshold" min="0" max="1" step="0.1" value="0.5">
                </div>
                
                <div class="setting-group">
                    <label>Sort By</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="sortSales" name="sortBy" value="sales" checked>
                            <label for="sortSales">💰 Total Sales Value</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="sortCount" name="sortBy" value="count">
                            <label for="sortCount">🔢 Count (Descriptions)</label>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="button-group">
                <button class="btn btn-primary" onclick="processData()" id="processBtn">
                    ▶️ Process Data
                </button>
                <button class="btn btn-success" onclick="exportResults()" id="exportBtn" style="display: none;">
                    💾 Export Results
                </button>
                <button class="btn btn-danger" onclick="clearResults()">
                    🗑️ Clear
                </button>
            </div>
            
            <!-- Loading -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Processing your data... Please wait</p>
            </div>
            
            <!-- Results Section -->
            <div id="resultsSection" class="results-section">
                <h2 style="margin-bottom: 25px; color: #2c3e50;">📋 Analysis Results</h2>
                
                <div id="stats" class="stats"></div>
                
                <div id="groups"></div>
            </div>
        </div>
    </div>
    
    <script>
        let exportFilename = null;
        
        // File input handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name;
            if (fileName) {
                document.getElementById('fileName').textContent = `Selected: ${fileName}`;
                document.getElementById('fileName').style.display = 'block';
            }
        });
        
        // Process data
        async function processData() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                showError('Please select a file first!');
                return;
            }
            
            const threshold = document.getElementById('threshold').value;
            const sortBy = document.querySelector('input[name="sortBy"]:checked').value;
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('threshold', threshold);
            formData.append('sort_by', sortBy);
            
            showLoading(true);
            hideError();
            
            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                } else {
                    displayResults(data);
                    exportFilename = data.export_filename;
                    document.getElementById('exportBtn').style.display = 'block';
                }
            } catch (error) {
                showError('An error occurred: ' + error.message);
            } finally {
                showLoading(false);
            }
        }
        
        // Display results
        function displayResults(data) {
            const resultsSection = document.getElementById('resultsSection');
            const statsDiv = document.getElementById('stats');
            const groupsDiv = document.getElementById('groups');
            
            // Show stats
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="number">${data.total_products}</div>
                    <div class="label">Total Products</div>
                </div>
                <div class="stat-card">
                    <div class="number">${data.similar_pairs}</div>
                    <div class="label">Similar Pairs</div>
                </div>
                <div class="stat-card">
                    <div class="number">${data.total_groups}</div>
                    <div class="label">Total Groups</div>
                </div>
                <div class="stat-card">
                    <div class="number">${data.threshold}</div>
                    <div class="label">Threshold Used</div>
                </div>
            `;
            
            // Show groups
            groupsDiv.innerHTML = '';
            data.groups.forEach(group => {
                const groupCard = document.createElement('div');
                groupCard.className = 'group-card';
                
                const productsHTML = group.products.map(product => `
                    <li class="product-item">
                        <div class="product-name">${product.description}</div>
                        <div class="product-sales">Sales Value: ${product.sales_value.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                    </li>
                `).join('');
                
                groupCard.innerHTML = `
                    <div class="group-header">
                        <div class="group-title">Group ${group.group_number}</div>
                        <div class="group-stats">
                            <div class="group-stat">
                                <div class="value">${group.count}</div>
                                <div class="label">Items</div>
                            </div>
                            <div class="group-stat">
                                <div class="value">${group.total_sales.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                                <div class="label">Total Sales</div>
                            </div>
                        </div>
                    </div>
                    <ul class="product-list">
                        ${productsHTML}
                    </ul>
                `;
                
                groupsDiv.appendChild(groupCard);
            });
            
            resultsSection.classList.add('show');
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }
        
        // Export results
        function exportResults() {
            if (exportFilename) {
                window.location.href = `/export/${exportFilename}`;
            }
        }
        
        // Clear results
        function clearResults() {
            document.getElementById('fileInput').value = '';
            document.getElementById('fileName').style.display = 'none';
            document.getElementById('resultsSection').classList.remove('show');
            document.getElementById('exportBtn').style.display = 'none';
            hideError();
            exportFilename = null;
        }
        
        // Show/hide loading
        function showLoading(show) {
            const loading = document.getElementById('loading');
            const processBtn = document.getElementById('processBtn');
            
            if (show) {
                loading.classList.add('show');
                processBtn.disabled = true;
            } else {
                loading.classList.remove('show');
                processBtn.disabled = false;
            }
        }
        
        // Show error
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.classList.add('show');
        }
        
        // Hide error
        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.remove('show');
        }
    </script>
</body>
</html>
