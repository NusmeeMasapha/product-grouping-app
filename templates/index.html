<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grouping</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊Product Grouping</h1>
            <p>Analyze and group similar products based on descriptions</p>
        </div>
        
        <div class="content">
            <!-- Main Grid: Left Column | Right Column -->
            <div id="errorMessage" class="error-message"></div>
            
            <div class="main-content-grid">
                <!-- LEFT COLUMN: Upload, Settings, Buttons -->
                <div class="left-panel">
                    <!-- Upload Section -->
                    <div class="upload-section">
                        <h2 style="margin-bottom: 12px; color: #2c3e50; font-weight: 700; font-size: 0.85em;">📂 Upload Excel File</h2>
                        <div class="file-input-wrapper">
                            <input type="file" id="fileInput" accept=".xlsx,.xls">
                            <label for="fileInput" class="file-input-label">
                                <span>📁 Click to select Excel file</span>
                            </label>
                        </div>
                        <div id="fileName" class="file-name" style="display: none;"></div>
                    </div>
                    
                    <!-- Settings Section -->
                    <div class="settings-section">
                        <h2 style="margin-bottom: 15px; color: #2c3e50; font-weight: 700; font-size: 0.85em;">⚙️ Analysis Settings</h2>
                        
                        <div class="setting-group">
                            <label style="font-weight: 700;">Similarity Threshold (0.0 - 1.0)</label>
                            <input type="number" id="threshold" min="0" max="1" step="0.1" value="0.5">
                        </div>
                        
                        <div class="setting-group">
                            <label style="font-weight: 700;">Sort By</label>
                            <div class="radio-group">
                                <div class="radio-option">
                                    <input type="radio" id="sortSales" name="sortBy" value="sales" checked>
                                    <label for="sortSales">💰 Total Sales Value</label>
                                </div>
                                <div class="radio-option">
                                    <input type="radio" id="sortCount" name="sortBy" value="count">
                                    <label for="sortCount">🔢 Count (Descriptions)</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="button-group">
                        <button class="btn btn-primary" onclick="processData()" id="processBtn">
                            ▶️ Process Data
                        </button>
                        <button class="btn btn-danger" onclick="clearResults()">
                            🗑️ Clear
                        </button>
                    </div>
                    
                    <!-- Loading -->
                    <div id="loading" class="loading">
                        <div class="spinner"></div>
                        <p>Processing your data... Please wait</p>
                    </div>
                </div>
                
                <!-- RIGHT COLUMN: AI Search + Results -->
                <div class="right-panel">
                    <!-- AI Search Panel (Compact) -->
                    <div id="aiPanel" class="ai-panel-compact" style="display: none;">
                        <h3 style="margin: 0 0 10px 0; color: #2c3e50; font-size: 1em; font-weight: 600;">🤖 AI Assistant</h3>
                        
                        <!-- Ask Question Box - Full Width -->
                        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 15px;">
                            <input type="text" id="aiQuestion" placeholder="ถามคำถามอะไรก็ได้....." onkeypress="if(event.key==='Enter') askAI()" 
                                style="flex: 1; padding: 10px 12px; border: 2px solid #dee2e6; border-radius: 8px; font-size: 0.9em;">
                            <button onclick="askAI()" id="askBtn" 
                                style="padding: 10px 16px; background: #2d6df6; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 0.85em; font-weight: 600; white-space: nowrap; transition: all 0.3s;">
                                ถาม
                            </button>
                            <button onclick="clearAI()" id="clearAIBtn" 
                                style="padding: 10px 16px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 0.85em; font-weight: 600; white-space: nowrap; transition: all 0.3s;">
                                ล้าง
                            </button>
                        </div>
                        
                        <!-- AI Response Area -->
                        <div id="aiResponse" class="ai-response"></div>
                    </div>
                    
                    <!-- Results Section -->
                    <div id="resultsSection" class="results-section">
                        <h2 style="margin-bottom: 25px; color: #2c3e50;">📋 Results</h2>
                        <div id="stats" class="stats"></div>
                        <div id="groups"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let exportFilename = null;
        
        // File input handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name;
            if (fileName) {
                document.getElementById('fileName').textContent = `Selected: ${fileName}`;
                document.getElementById('fileName').style.display = 'block';
            }
        });
        
        // Process data
        async function processData() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                showError('Please select a file first!');
                return;
            }
            
            const threshold = document.getElementById('threshold').value;
            const sortBy = document.querySelector('input[name="sortBy"]:checked').value;
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('threshold', threshold);
            formData.append('sort_by', sortBy);
            
            showLoading(true);
            hideError();
            
            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                } else {
                    displayResults(data);
                    exportFilename = data.export_filename;
                    
                    // Always show AI Panel after processing
                    document.getElementById('aiPanel').style.display = 'block';
                    
                    // Show warning if RAG is not loaded
                    if (!data.rag_loaded) {
                        const aiResponse = document.getElementById('aiResponse');
                        aiResponse.innerHTML = `
                            <div style="background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107; color: #856404;">
                                <strong>⚠️ AI Assistant ไม่พร้อมใช้งาน</strong><br>
                                กรุณาตั้งค่า CLAUDE_API_KEY environment variable<br>
                                <small>หรือติดตั้ง dependencies ที่จำเป็น</small>
                            </div>
                        `;
                        aiResponse.classList.add('show');
                    }
                }
            } catch (error) {
                showError('An error occurred: ' + error.message);
            } finally {
                showLoading(false);
            }
        }
        
        // Display results
        function displayResults(data) {
            const resultsSection = document.getElementById('resultsSection');
            const statsDiv = document.getElementById('stats');
            const groupsDiv = document.getElementById('groups');
            
            // Calculate total sales value from all groups
            const totalSalesValue = data.groups.reduce((sum, group) => sum + group.total_sales, 0);
            
            // Show stats
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="number">${data.total_products}</div>
                    <div class="label">Total Products</div>
                </div>
                <div class="stat-card">
                    <div class="number">${data.total_groups}</div>
                    <div class="label">Total Groups</div>
                </div>
                <div class="stat-card">
                    <div class="number">${totalSalesValue.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</div>
                    <div class="label">Total Sales Value</div>
                </div>
            `;
            
            // Show groups
            groupsDiv.innerHTML = '';
            data.groups.forEach(group => {
                const groupCard = document.createElement('div');
                groupCard.className = 'group-card';
                
                const productsHTML = group.products.map(product => `
                    <li class="product-item">
                        <div class="product-name">${product.description}</div>
                        <div class="product-sales">Sales Value: ${product.sales_value.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                    </li>
                `).join('');
                
                groupCard.innerHTML = `
                    <div class="group-header">
                        <div class="group-title">Group ${group.group_number}</div>
                        <div class="group-stats">
                            <div class="group-stat">
                                <div class="value">${group.count}</div>
                                <div class="label">Items</div>
                            </div>
                            <div class="group-stat">
                                <div class="value">${group.total_sales.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</div>
                                <div class="label">Total Sales</div>
                            </div>
                        </div>
                    </div>
                    <ul class="product-list">
                        ${productsHTML}
                    </ul>
                `;
                
                groupsDiv.appendChild(groupCard);
            });
            
            resultsSection.classList.add('show');
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }
        
        // Clear results
        function clearResults() {
            document.getElementById('fileInput').value = '';
            document.getElementById('fileName').style.display = 'none';
            document.getElementById('resultsSection').classList.remove('show');
            hideError();
            exportFilename = null;
        }
        
        // Show/hide loading
        function showLoading(show) {
            const loading = document.getElementById('loading');
            const processBtn = document.getElementById('processBtn');
            
            if (show) {
                loading.classList.add('show');
                processBtn.disabled = true;
            } else {
                loading.classList.remove('show');
                processBtn.disabled = false;
            }
        }
        
        // Show error
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.classList.add('show');
        }
        
        // Hide error
        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.remove('show');
        }
        
        // AI Search Functions
        async function askAI() {
            const question = document.getElementById('aiQuestion').value.trim();
            if (!question) {
                showError('กรุณาพิมพ์คำถาม');
                return;
            }
            
            const askBtn = document.getElementById('askBtn');
            const responseDiv = document.getElementById('aiResponse');
            
            // Disable button and show loading
            askBtn.disabled = true;
            askBtn.textContent = 'กำลังคิด...';
            responseDiv.innerHTML = '<div style="text-align: center; padding: 20px;"><div class="spinner" style="margin: 0 auto;"></div><p>AI กำลังวิเคราะห์ข้อมูล...</p></div>';
            responseDiv.classList.add('show');
            
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question: question })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Format the answer with nice styling
                    responseDiv.innerHTML = `
                        <div style="background: white; padding: 20px; border-radius: 8px; border-left: 4px solid #2d6df6;">
                            <h3 style="margin-top: 0; color: #2d6df6; font-size: 1.1em;">💡 คำตอบ:</h3>
                            <div style="white-space: pre-wrap; line-height: 1.8; color: #2c3e50;">${data.answer}</div>
                        </div>
                    `;
                    
                    // Show sources if available
                    if (data.sources && data.sources.length > 0) {
                        const sourcesHTML = data.sources.map((source, idx) => `
                            <div style="padding: 10px; background: #f8f9fa; margin: 5px 0; border-radius: 6px; font-size: 0.85em;">
                                <strong>แหล่งที่ ${idx + 1}:</strong> ${source.content}
                            </div>
                        `).join('');
                        
                        responseDiv.innerHTML += `
                            <div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                                <h4 style="margin-top: 0; color: #6c757d; font-size: 0.9em;">📚 แหล่งข้อมูลที่ใช้:</h4>
                                ${sourcesHTML}
                            </div>
                        `;
                    }
                } else {
                    responseDiv.innerHTML = `
                        <div style="background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107; color: #856404;">
                            <strong>⚠️ เกิดข้อผิดพลาด:</strong><br>
                            ${data.error || 'ไม่สามารถประมวลผลคำถามได้'}
                        </div>
                    `;
                }
            } catch (error) {
                responseDiv.innerHTML = `
                    <div style="background: #f8d7da; padding: 15px; border-radius: 8px; border-left: 4px solid #dc3545; color: #721c24;">
                        <strong>❌ เกิดข้อผิดพลาด:</strong><br>
                        ${error.message}
                    </div>
                `;
            } finally {
                askBtn.disabled = false;
                askBtn.textContent = 'ถาม';
            }
        }
        
        // Clear AI response
        function clearAI() {
            document.getElementById('aiQuestion').value = '';
            document.getElementById('aiResponse').innerHTML = '';
            document.getElementById('aiResponse').classList.remove('show');
        }
        
        // Get AI Insights
        async function getInsights() {
            const responseDiv = document.getElementById('aiResponse');
            const aiPanel = document.getElementById('aiPanel');
            
            // Show AI panel if hidden
            if (aiPanel.style.display === 'none') {
                aiPanel.style.display = 'block';
            }
            
            // Show loading
            responseDiv.innerHTML = '<div style="text-align: center; padding: 20px;"><div class="spinner" style="margin: 0 auto;"></div><p>AI กำลังวิเคราะห์และสร้าง Insights...</p></div>';
            responseDiv.classList.add('show');
            
            try {
                const response = await fetch('/insights', {
                    method: 'GET'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    responseDiv.innerHTML = `
                        <div style="background: white; padding: 20px; border-radius: 8px; border-left: 4px solid #28a745;">
                            <h3 style="margin-top: 0; color: #28a745; font-size: 1.1em;">💡 AI Insights:</h3>
                            <div style="white-space: pre-wrap; line-height: 1.8; color: #2c3e50;">${data.answer}</div>
                        </div>
                    `;
                } else {
                    responseDiv.innerHTML = `
                        <div style="background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107; color: #856404;">
                            <strong>⚠️ เกิดข้อผิดพลาด:</strong><br>
                            ${data.error || 'ไม่สามารถสร้าง Insights ได้'}
                        </div>
                    `;
                }
            } catch (error) {
                responseDiv.innerHTML = `
                    <div style="background: #f8d7da; padding: 15px; border-radius: 8px; border-left: 4px solid #dc3545; color: #721c24;">
                        <strong>❌ เกิดข้อผิดพลาด:</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
